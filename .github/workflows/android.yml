name: Build Android APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
          npm_config_optional: false

      - name: Copy FFmpeg WASM to public
        run: |
          mkdir -p src/renderer/public/ffmpeg
          cp node_modules/@ffmpeg/core/dist/umd/ffmpeg-core.js src/renderer/public/ffmpeg/
          cp node_modules/@ffmpeg/core/dist/umd/ffmpeg-core.wasm src/renderer/public/ffmpeg/

      - name: Build mobile web assets
        run: |
          npx vite build --config vite.config.mobile.ts
          node -e "const fs=require('fs');try{fs.renameSync('dist-mobile/index.mobile.html','dist-mobile/index.html')}catch(e){}"
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
          NODE_OPTIONS: '--max-old-space-size=4096'

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor to Android
        run: npx cap sync android
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Preparar APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/Cineo-Android.apk
          ls -lh artifacts/

      - name: Salvar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Cineo-Android
          path: artifacts/Cineo-Android.apk
          retention-days: 90

      - name: Publicar no GitHub Release (só em tags v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/Cineo-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK para gofile.io e imprimir link
        if: always() && steps.build-android.outputs.result != 'failure'
        run: |
          SERVER=$(curl -s https://api.gofile.io/servers | node -e "process.stdin.resume();let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).data.servers[0].name))")
          RESULT=$(curl -s -F "file=@artifacts/Cineo-Android.apk" "https://${SERVER}.gofile.io/contents/uploadFile")
          LINK=$(echo "$RESULT" | node -e "process.stdin.resume();let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).data.downloadPage))")
          echo ""
          echo "========================================"
          echo "  APK ANDROID DISPONIVEL PARA DOWNLOAD:"
          echo "  $LINK"
          echo "========================================"
