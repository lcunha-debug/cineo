name: Build Android APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar plugins Capacitor (sem scripts pesados)
        run: |
          npm install --ignore-scripts \
            @capacitor/core@8 \
            @capacitor/android@8 \
            @capacitor/filesystem@8 \
            @capacitor/share@8

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK 36 e Build Tools
        run: sdkmanager "platforms;android-36" "build-tools;35.0.1" --sdk_root=$ANDROID_HOME

      - name: Criar local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copiar APK
        run: |
          mkdir -p artifacts
          APK=$(find android -name "*.apk" -type f | head -1)
          echo "APK: $APK"
          cp "$APK" artifacts/Cineo-Android.apk
          du -h artifacts/Cineo-Android.apk

      - name: Salvar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Cineo-Android
          path: artifacts/Cineo-Android.apk
          retention-days: 90

      - name: Publicar no GitHub Release (só em tags v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/Cineo-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK para gofile.io (pasta LFLVyK)
        run: |
          SERVER=$(curl -s https://api.gofile.io/servers | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['servers'][0]['name'])")
          RESULT=$(curl -s \
            -F "file=@artifacts/Cineo-Android.apk" \
            -F "token=y00naPMpmCJbgbDvaXJ8PR9FktVUtCWw" \
            -F "folderId=fa0872e3-4045-45f9-8932-46d9962acd2a" \
            "https://${SERVER}.gofile.io/contents/uploadFile")
          echo "Gofile result: $RESULT"
          FILE_ID=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['id'])" 2>/dev/null || echo "unknown")
          echo "File ID: $FILE_ID"
          LINK="https://gofile.io/d/LFLVyK"
          echo "APK disponível em: $LINK"
          echo "========================================"
          echo "  APK: $LINK"
          echo "========================================"
          # Gravar o file ID no repo para leitura externa
          echo "$FILE_ID" > gofile-apk-id.txt
          git config user.email "ci@github.com"
          git config user.name "CI Bot"
          git add gofile-apk-id.txt
          git commit -m "ci: gofile APK file ID atualizado [skip ci]" || true
          git push || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
