name: Build Android APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar plugins Capacitor (sem scripts pesados)
        run: |
          npm install --ignore-scripts \
            @capacitor/core@8 \
            @capacitor/android@8 \
            @capacitor/filesystem@8 \
            @capacitor/share@8

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK 35 e Build Tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" --sdk_root=$ANDROID_HOME

      - name: Criar local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Diagnostico pre-build
        run: |
          echo "=== node_modules/@capacitor/android/ ==="
          ls node_modules/@capacitor/android/ 2>/dev/null | head -20 || echo "NOT FOUND"
          echo "=== node_modules/@capacitor/android/capacitor/ ==="
          ls node_modules/@capacitor/android/capacitor/ 2>/dev/null | head -10 || echo "NOT FOUND"
          echo "=== node_modules/@capacitor/filesystem/android/ ==="
          ls node_modules/@capacitor/filesystem/android/ 2>/dev/null | head -5 || echo "NOT FOUND"
          echo "=== AGP version ==="
          grep "com.android.tools.build:gradle" android/build.gradle
          echo "=== Gradle wrapper ==="
          cat android/gradle/wrapper/gradle-wrapper.properties | grep distributionUrl
          echo "=== ANDROID_HOME ==="
          echo $ANDROID_HOME
          ls $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms"

      - name: Build APK (captura log)
        id: gradle_build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --info > /tmp/gradle.log 2>&1
          echo "EXIT=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Publicar log de erro no repo
        if: steps.gradle_build.outcome == 'failure'
        run: |
          tail -200 /tmp/gradle.log > gradle-error.log
          git config user.email "ci@github.com"
          git config user.name "CI Bot"
          git add gradle-error.log
          git commit -m "ci: gradle error log [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Falhar se build falhou
        if: steps.gradle_build.outcome == 'failure'
        run: exit 1

      - name: Copiar APK
        run: |
          mkdir -p artifacts
          APK=$(find android -name "*.apk" -type f | head -1)
          echo "APK: $APK"
          cp "$APK" artifacts/Cineo-Android.apk
          du -h artifacts/Cineo-Android.apk

      - name: Salvar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Cineo-Android
          path: artifacts/Cineo-Android.apk
          retention-days: 90

      - name: Publicar no GitHub Release (só em tags v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/Cineo-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK para gofile.io
        run: |
          SERVER=$(curl -s https://api.gofile.io/servers | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['servers'][0]['name'])")
          RESULT=$(curl -s -F "file=@artifacts/Cineo-Android.apk" "https://${SERVER}.gofile.io/contents/uploadFile")
          LINK=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['downloadPage'])")
          echo "========================================"
          echo "  APK: $LINK"
          echo "========================================"
