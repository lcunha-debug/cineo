name: Build Android APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copiar APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/Cineo-Android.apk
          du -h artifacts/Cineo-Android.apk

      - name: Salvar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Cineo-Android
          path: artifacts/Cineo-Android.apk
          retention-days: 90

      - name: Publicar no GitHub Release (só em tags v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/Cineo-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK para gofile.io
        run: |
          SERVER=$(curl -s https://api.gofile.io/servers | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['servers'][0]['name'])")
          RESULT=$(curl -s -F "file=@artifacts/Cineo-Android.apk" "https://${SERVER}.gofile.io/contents/uploadFile")
          LINK=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['downloadPage'])")
          echo "========================================"
          echo "  APK: $LINK"
          echo "========================================"
